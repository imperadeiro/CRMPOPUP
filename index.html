<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>CRM Screen Pop</title>

<style>
body{
  font-family: Arial, sans-serif;
  padding:20px;
  background:#f5f5f5;
}

button{
  background:#00a0df;
  color:white;
  border:none;
  padding:10px 20px;
  cursor:pointer;
  border-radius:5px;
  font-size:14px;
}

#status{
  margin-top:15px;
  color:green;
}
</style>

</head>
<body>

<h2>CRM ScreenPop Activo</h2>

<p>Teste manual de abertura do CRM</p>

<button onclick="abrirCRM()">
Abrir CRM
</button>

<div id="status">
Sidebar carregada correctamente.
</div>

<script>

function abrirCRM() {

    const numero = "912345678";

    const url =
        "https://intranet2.cpcdi.pt/Main/EscolheCliente/GuardaCookie?tipo=guardar&cod_cliente=25555?telefone=" +
        encodeURIComponent(numero);

    window.open(url,"_blank");

}

</script>

</body>
</html>
