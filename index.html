<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>CRM Screen Pop</title>

<style>
body{
    font-family: Arial;
    padding:20px;
    background:#f4f4f4;
}

button{
    background:#0096D6;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

#resultado{
    margin-top:15px;
    color:green;
    font-weight:bold;
}
</style>

</head>

<body>

<h2>CRM ScreenPop Activo</h2>

<button id="btTeste">
Testar abertura CRM
</button>

<div id="resultado">
A aguardar teste...
</div>

<script>

document.getElementById("btTeste").addEventListener("click", function(){

    document.getElementById("resultado").innerHTML =
        "A tentar abrir CRM...";

    const numero = "912345678";

    const url =
      "https://intranet2.cpcdi.pt/Main/EscolheCliente/GuardaCookie?tipo=guardar&cod_cliente=25555?telefone=" +
      numero;

    window.open(url, "_blank");

});

</script>

</body>
</html>
