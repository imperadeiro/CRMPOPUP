<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CRM ScreenPop</title>
</head>
<body>

<h2>CRM ScreenPop</h2>

<script src="https://unpkg.com/@webex/embeddedkscript>

<script>

async function init() {

    try {

        await window.webex.app.initialize();

        document.body.innerHTML +=
            "<p>Webex inicializado com sucesso</p>";

        console.log("Webex OK");
        console.log(window.webex);

    }
    catch(ex) {

        console.error(ex);

        document.body.innerHTML +=
            "<p>ERRO: " + ex.message + "</p>";

    }

}

init();

</script>

</body>
</html>
